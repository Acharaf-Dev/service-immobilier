version: '3.9'

services:

  # Frontend Next.js
  frontend:
    container_name: service_immobilier_frontend
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    working_dir: /app
    environment:
      - NODE_ENV=production
    command: npm run start
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - service_immobilier_net

  # Backend Laravel (PHP 8.2)
  backend:
    container_name: service_immobilier_backend
    build: ./backend
    volumes:
      - ./backend:/var/www
    working_dir: /var/www
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=immobilier_db
      - DB_USERNAME=root
      - DB_PASSWORD=root
    depends_on:
      - mysql
    command: php artisan serve --host=0.0.0.0 --port=8000
    restart: unless-stopped
    networks:
      - service_immobilier_net

  # MySQL database
  mysql:
    image: mysql:8.0
    container_name: service_immobilier_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: immobilier_db
    restart: unless-stopped
    networks:
      - service_immobilier_net

  # PhpMyAdmin (optionnel pour visualiser la DB)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: service_immobilier_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - mysql
    networks:
      - service_immobilier_net

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: service_immobilier_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend:/var/www/html/frontend
      - ./backend:/var/www/html/backend
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - service_immobilier_net

volumes:
  db_data:

networks:
  service_immobilier_net:
    driver: bridge
